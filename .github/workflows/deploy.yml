# .github/workflows/deploy.yml
# GitHub Actions workflow to build Docker images for backend and frontend
# and push them to GitHub Container Registry (ghcr.io).
# Adjust image names/tags as needed.

name: Deploy SmartAid

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------- Backend --------
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smartaid-backend:latest

      # -------- Frontend --------
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-new
          file: ./frontend-new/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smartaid-frontend:latest
