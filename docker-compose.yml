# SmartAid AI — Docker Compose Production Stack
# Services: PostgreSQL 16 Database + FastAPI Backend
# Frontend is optimized for Edge/CDN deployment (e.g. Cloudflare Pages / Vercel)
# or can be proxied to the backend network.

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: smartaid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartaid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-smartaid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smartaid_user} -d $${POSTGRES_DB:-smartaid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Expose only if direct external DB inspection is required; omit in tight prod
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - smartaid-network

  # ── FastAPI Backend Service ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartaid-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartaid_user}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-smartaid}
      SECRET_KEY: ${SECRET_KEY:-change_me_to_a_secure_random_hex_key}
      APP_BASE_URL: ${APP_BASE_URL:-https://smartaid.app}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://smartaid.app,http://localhost:8080}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartaid-network

networks:
  smartaid-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
